[workspace]
resolver = "2"
members = ["crates/player-core", "crates/player-spotatui", "apps/player"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# Pin both GPUI crates to the same official Zed revision.
gpui = { git = "https://github.com/zed-industries/zed", rev = "239d0aa15838ec24d4691659f52fd5e8d7d50d17" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "239d0aa15838ec24d4691659f52fd5e8d7d50d17", features = ["wayland", "x11", "font-kit", "runtime_shaders"] }

player-core = { path = "crates/player-core" }
player-spotatui = { path = "crates/player-spotatui" }

# Keep the production dependency as a Git pin. During coordinated local
# development, `.cargo/config.toml` patches it to the sibling engine checkout
# so the app exercises unreleased engine fixes; remove that patch after the
# engine revision is published and pinned.
spotatui = { git = "https://github.com/jhoogstraat/spotatui", rev = "91f0363134791ca311843ac632aef292588868bd", default-features = false, features = ["streaming", "macos-media"] }

tokio = { version = "1", default-features = false, features = ["sync"] }
