[workspace]
resolver = "2"
members = ["crates/player-core", "crates/player-spotatui", "apps/player"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# Keep the exact GPUI revision used by Comet while its UI components depend on
# fork-only backdrop-blur and edge-fade APIs.
gpui = { git = "https://github.com/wingleeio/zed", rev = "e2ddcc6805f8c5088e62a60dfe517abcccd61a9a" }
gpui_platform = { git = "https://github.com/wingleeio/zed", rev = "e2ddcc6805f8c5088e62a60dfe517abcccd61a9a", features = ["wayland", "x11", "font-kit", "runtime_shaders"] }

player-core = { path = "crates/player-core" }
player-spotatui = { path = "crates/player-spotatui" }

# Production will pin the private fork over Git once its frontend API is
# public: git = "https://github.com/jhoogstraat/spotatui", rev = "...". The
# path dependency on the sibling checkout is the documented local override
# for coordinated development until that revision is cut.
# Engine consumed via a Git pin (ADR 0015 end state; ADR 0016 stage 4):
# the fork morph is complete and the local path override is retired. A
# `.cargo/config.toml` enables CLI git fetch so credential management
# matches normal git usage.
spotatui = { git = "https://github.com/jhoogstraat/spotatui", rev = "147c1d5", default-features = false, features = ["streaming"] }

tokio = { version = "1", default-features = false, features = ["sync"] }
